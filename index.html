<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubra Seu Prato Ideal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background-hearts"></div>

    <main class="container">

        <div id="quiz-screen">
            <h1>✨ Descubra Seu Prato Ideal ✨</h1>
            <p class="subtitle">
                Responda às perguntas e descubra qual prato combina com sua personalidade!
            </p>

            <div id="question-container">
                <h2 id="question"></h2>
                <div id="answers"></div>
            </div>

            <button id="nextBtn" disabled>Próxima 💖</button>
        </div>

        <div id="result-screen" class="hidden">
            <h1>Seu resultado foi...</h1>

            <div class="result-card">
                <div id="emoji" class="emoji"></div>
                <h2 id="result-title"></h2>
                <p id="result-description"></p>
            </div>

            <button onclick="location.reload()">
                Refazer Quiz 💕
            </button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
